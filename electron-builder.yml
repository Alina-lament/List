appId: com.younglife.app
productName: YoungLife
npmRebuild: false
publish: null
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - build/list-icons/**
  - build/tray.ico
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: 2052
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/installer.nsh
