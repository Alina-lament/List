appId: com.younglife.app
productName: YoungLife
npmRebuild: false
publish: null
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
  - 'out/renderer/vditor/**'
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: 2052
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/installer.nsh
